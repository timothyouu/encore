<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no" />
    <title>Encore</title>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        /* ER brand dark-theme surface (#232323) + Neutral-200 text (#E5E5E5). */
        background: #232323;
        color: #E5E5E5;
        font: 14px/1.4 -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
        /* Kill WebView zoom + iOS auto-sizing + rubber-band scroll. */
        touch-action: manipulation;
        -webkit-text-size-adjust: 100%;
        overscroll-behavior: none;
      }
      /* Startup/error trail written by src/status.ts. */
      #app {
        height: 100%;
        padding: 24px;
        box-sizing: border-box;
        white-space: pre-wrap;
        font: 12px/1.5 ui-monospace, Menlo, monospace;
        overflow-y: auto;
      }
    </style>
  </head>
  <body>
    <div id="app">Loading Encore… (if this never changes, the script did not load)</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
