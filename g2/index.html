<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#F6F2EA" />
    <title>Encore</title>
    <style>
      html, body {
        /* Kill WebView zoom + iOS auto-sizing + rubber-band scroll. */
        touch-action: manipulation;
        -webkit-text-size-adjust: 100%;
        overscroll-behavior: none;
      }
      /* Glasses-side diagnostics (src/status.ts, src/phone.ts), below the phone UI. */
      #debug {
        max-width: 390px;
        margin: 0 auto 24px;
        padding: 0 24px;
        color: #625F58;
        font: 14px/1.5 system-ui, sans-serif;
      }
      #debug summary {
        min-height: 44px;
        display: flex;
        align-items: center;
        cursor: pointer;
      }
      #settings label {
        display: block;
        margin-bottom: 6px;
        font-size: 13px;
      }
      #settings .row {
        display: flex;
        gap: 8px;
      }
      #settings input {
        flex: 1;
        min-width: 0;
        padding: 10px 12px;
        border: 1px solid #D8D2C7;
        border-radius: 10px;
        background: #F6F2EA;
        color: #171714;
        font: inherit;
      }
      #settings button {
        padding: 10px 16px;
        border: 0;
        border-radius: 10px;
        background: #171714;
        color: #F6F2EA;
        font: inherit;
        font-weight: 600;
      }
      #log {
        margin: 12px 0 0;
        max-height: 40vh;
        overflow-y: auto;
        white-space: pre-wrap;
        font: 12px/1.5 ui-monospace, Menlo, monospace;
      }
    </style>
  </head>
  <body>
    <div id="app">Loading Encore… (if this never changes, the script did not load)</div>
    <details id="debug">
      <summary>Glasses debug</summary>
      <div id="settings"></div>
      <pre id="log"></pre>
    </details>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
